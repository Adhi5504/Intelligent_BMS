<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1b4d3e"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b2e25">PumpRupee: system architecture (SME retrofit)</text>

  <!-- column titles -->
  <text x="150" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4d3e">1. PLANT (existing equipment)</text>
  <text x="500" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4d3e">2. EDGE GATEWAY (ESP32 / Raspberry Pi)</text>
  <text x="850" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4d3e">3. OWNER and BUSINESS SYSTEMS</text>

  <!-- plant -->
  <rect x="30" y="85" width="240" height="90" rx="8" fill="#e8f5e9" stroke="#1b4d3e"/>
  <text x="150" y="112" text-anchor="middle" font-size="13" font-weight="bold">Motor + pump</text>
  <text x="150" y="132" text-anchor="middle" font-size="12">existing, any make</text>
  <text x="150" y="152" text-anchor="middle" font-size="12">tank / process load</text>

  <rect x="30" y="200" width="240" height="190" rx="8" fill="#f1f8e9" stroke="#1b4d3e"/>
  <text x="150" y="225" text-anchor="middle" font-size="13" font-weight="bold">Low-cost sensors</text>
  <text x="150" y="252" text-anchor="middle" font-size="12">CT clamp: current, kW, kWh</text>
  <text x="150" y="276" text-anchor="middle" font-size="12">Vibration (accelerometer)</text>
  <text x="150" y="300" text-anchor="middle" font-size="12">Pressure transducer</text>
  <text x="150" y="324" text-anchor="middle" font-size="12">Flow (clamp-on, if available)</text>
  <text x="150" y="348" text-anchor="middle" font-size="12">Motor temperature (optional)</text>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#555">no PLC required</text>

  <rect x="30" y="415" width="240" height="90" rx="8" fill="#fff3e0" stroke="#8a5a00"/>
  <text x="150" y="442" text-anchor="middle" font-size="13" font-weight="bold">VFD (drive)</text>
  <text x="150" y="464" text-anchor="middle" font-size="12">speed setpoint over Modbus RTU</text>
  <text x="150" y="486" text-anchor="middle" font-size="12">manual bypass always kept</text>

  <!-- edge -->
  <rect x="360" y="85" width="280" height="420" rx="8" fill="#e3f2fd" stroke="#0d47a1"/>
  <rect x="380" y="105" width="240" height="56" rx="6" fill="#ffffff" stroke="#0d47a1"/>
  <text x="500" y="128" text-anchor="middle" font-size="13" font-weight="bold">Acquire and clean</text>
  <text x="500" y="148" text-anchor="middle" font-size="11">sampling, filtering, features</text>

  <rect x="380" y="175" width="240" height="66" rx="6" fill="#ffffff" stroke="#0d47a1"/>
  <text x="500" y="198" text-anchor="middle" font-size="13" font-weight="bold">Physics baseline</text>
  <text x="500" y="218" text-anchor="middle" font-size="11">healthy power vs speed and load</text>
  <text x="500" y="233" text-anchor="middle" font-size="11">excess power = waste (Rs/day)</text>

  <rect x="380" y="255" width="240" height="66" rx="6" fill="#ffffff" stroke="#0d47a1"/>
  <text x="500" y="278" text-anchor="middle" font-size="13" font-weight="bold">Failure-risk model</text>
  <text x="500" y="298" text-anchor="middle" font-size="11">vibration trend to failure probability</text>
  <text x="500" y="313" text-anchor="middle" font-size="11">with repair-by date and cost math</text>

  <rect x="380" y="335" width="240" height="66" rx="6" fill="#ffffff" stroke="#0d47a1"/>
  <text x="500" y="358" text-anchor="middle" font-size="13" font-weight="bold">Speed controller</text>
  <text x="500" y="378" text-anchor="middle" font-size="11">lowest speed meeting flow and pressure</text>
  <text x="500" y="393" text-anchor="middle" font-size="11">hard limits; falls back to fixed speed</text>

  <rect x="380" y="415" width="240" height="72" rx="6" fill="#ffffff" stroke="#0d47a1"/>
  <text x="500" y="438" text-anchor="middle" font-size="13" font-weight="bold">Local store + dashboard</text>
  <text x="500" y="458" text-anchor="middle" font-size="11">works offline; syncs when the network is up</text>
  <text x="500" y="473" text-anchor="middle" font-size="11">local-language display</text>

  <!-- owner side -->
  <rect x="730" y="85" width="240" height="110" rx="8" fill="#fce4ec" stroke="#880e4f"/>
  <text x="850" y="110" text-anchor="middle" font-size="13" font-weight="bold">Owner view (phone / screen)</text>
  <text x="850" y="134" text-anchor="middle" font-size="12">1. today's waste in Rs</text>
  <text x="850" y="154" text-anchor="middle" font-size="12">2. savings this month</text>
  <text x="850" y="174" text-anchor="middle" font-size="12">3. repair-by date</text>

  <rect x="730" y="215" width="240" height="110" rx="8" fill="#f3e5f5" stroke="#4a148c"/>
  <text x="850" y="240" text-anchor="middle" font-size="13" font-weight="bold">ERP / accounts export</text>
  <text x="850" y="264" text-anchor="middle" font-size="12">energy cost per batch (CSV / API)</text>
  <text x="850" y="284" text-anchor="middle" font-size="12">maintenance work order</text>
  <text x="850" y="304" text-anchor="middle" font-size="12">Scope 2 CO2 report (buyer requests)</text>

  <rect x="730" y="345" width="240" height="90" rx="8" fill="#f5f5f5" stroke="#555" stroke-dasharray="5 4"/>
  <text x="850" y="370" text-anchor="middle" font-size="13" font-weight="bold">Optional cloud</text>
  <text x="850" y="394" text-anchor="middle" font-size="12">multi-site learning</text>
  <text x="850" y="414" text-anchor="middle" font-size="12">(shown as a simulation only)</text>

  <!-- arrows -->
  <line x1="150" y1="175" x2="150" y2="200" stroke="#1b4d3e" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="192" font-size="10" fill="#333">measures</text>
  <line x1="270" y1="295" x2="360" y2="150" stroke="#1b4d3e" stroke-width="2" marker-end="url(#a)"/>
  <text x="285" y="230" font-size="10" fill="#333">analog / I2C / Modbus</text>
  <line x1="500" y1="161" x2="500" y2="175" stroke="#0d47a1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="241" x2="500" y2="255" stroke="#0d47a1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="321" x2="500" y2="335" stroke="#0d47a1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="401" x2="500" y2="415" stroke="#0d47a1" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="368" x2="270" y2="455" stroke="#8a5a00" stroke-width="2" marker-end="url(#a)"/>
  <text x="285" y="400" font-size="10" fill="#333">speed setpoint</text>
  <path d="M30 460 H14 V130 H30" fill="none" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="26" y="520" font-size="10" fill="#8a5a00">variable-frequency power to motor</text>
  <line x1="640" y1="440" x2="730" y2="150" stroke="#1b4d3e" stroke-width="2" marker-end="url(#a)"/>
  <text x="662" y="395" font-size="10" fill="#333">MQTT / Wi-Fi</text>
  <line x1="640" y1="300" x2="730" y2="270" stroke="#1b4d3e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="460" x2="730" y2="400" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- safety note -->
  <rect x="30" y="535" width="940" height="80" rx="8" fill="#fffde7" stroke="#8a6d00"/>
  <text x="500" y="562" text-anchor="middle" font-size="13" font-weight="bold">Throughput and quality protection</text>
  <text x="500" y="584" text-anchor="middle" font-size="12">The controller never lowers speed below what the required flow and pressure need; on any sensor fault or limit breach it returns the</text>
  <text x="500" y="602" text-anchor="middle" font-size="12">drive to fixed speed. Everything runs on the edge device, so the plant keeps working without internet.</text>
</svg>
